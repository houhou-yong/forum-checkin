name: 飞牛论坛 天天打卡

on:
  schedule:
    # 北京时间 06:00 = UTC 22:00（与其他签到错峰/对齐均可）
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read   # 公开仓库：绝不回写任何 token/cookie 文件

jobs:
  fnnas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FNNAS_COOKIE: ${{ secrets.FNNAS_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 天天打卡（含企业微信推送）
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          if [ -z "$FNNAS_COOKIE" ]; then
            echo "FNNAS_COOKIE 尚未配置，跳过（请设置 Secret = browser-cookie-capture 导出的 cookie JSON）"
            exit 0
          fi
          printf '%s' "$FNNAS_COOKIE" > fnnas_cookies.json
          python fnnas-checkin/fnnas_checkin.py --cookies fnnas_cookies.json
          echo "CHECKIN_EXIT=$?"
