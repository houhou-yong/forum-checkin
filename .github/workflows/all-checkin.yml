name: 每日全部签到

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  actions: write

jobs:
  # ====== 三站签到（不推送，结果写 artifact） ======
  forum-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      summary: ${{ steps.out.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Build runtime config
        env:
          PTTIME_COOKIE: ${{ secrets.PTTIME_COOKIE }}
          PTSKIT_COOKIE: ${{ secrets.PTSKIT_COOKIE }}
          WNFLB_USERNAME: ${{ secrets.WNFLB_USERNAME }}
          WNFLB_PASSWORD: ${{ secrets.WNFLB_PASSWORD }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python prepare_env.py
      - name: Run checkin (no push)
        run: python checkin_merged/daily_checkin_merged.py --no-push > forum_output.txt 2>&1 || true
      - name: Write summary
        id: out
        run: |
          echo 'summary<<SUMEOF' >> "$GITHUB_OUTPUT"
          cat forum_output.txt >> "$GITHUB_OUTPUT"
          echo 'SUMEOF' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: forum-result, path: forum_output.txt }

  # ====== 移动云盘签到（不推送，结果写 artifact） ======
  ydyp-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      summary: ${{ steps.out.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r ydyp-sign/requirements.txt
      - uses: actions/cache/restore@v4
        id: token-restore
        with: { path: ydyp-sign/ydyp_token_storage.json, key: ydyp-token }
      - name: Generate config (empty webhook = no push)
        env:
          YDYP_ACCOUNT: ${{ secrets.YDYP_ACCOUNT }}
        run: |
          cd ydyp-sign
          python -c "
          import json, os
          json.dump({'accounts':[os.environ['YDYP_ACCOUNT']],'push':{'wecom_webhook':''}},
                    open('config.json','w'), ensure_ascii=False, indent=2)
          "
      - name: Run YDYP checkin
        id: ydyp-run
        run: |
          cd ydyp-sign
          for i in 1 2 3; do
            echo "===== Attempt ${i}/3 ====="
            python run_ydyp.py > ydyp_output.txt 2>&1 && { echo "YDYP OK"; exit 0; }
            echo "Attempt ${i} failed"
            rm -f ydyp_token_storage.json
            sleep 30
          done
          echo "YDYP FAIL"
          exit 1
      - name: Write summary
        if: always()
        id: out
        run: |
          if [ -f ydyp-sign/ydyp_output.txt ]; then
            cp ydyp-sign/ydyp_output.txt ydyp_output.txt
          else
            echo "YDYP FAIL" > ydyp_output.txt
          fi
          echo 'summary<<SUMEOF' >> "$GITHUB_OUTPUT"
          cat ydyp_output.txt >> "$GITHUB_OUTPUT"
          echo 'SUMEOF' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ydyp-result, path: ydyp_output.txt }
      - uses: actions/cache/save@v4
        if: steps.ydyp-run.outcome == 'success'
        with: { path: ydyp-sign/ydyp_token_storage.json, key: ydyp-token }

  # ====== 汇总推送（合并成一条消息） ======
  notify:
    needs: [forum-checkin, ydyp-checkin]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总推送
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          FORUM_OK: ${{ needs.forum-checkin.outcome == 'success' }}
          YDYP_OK: ${{ needs.ydyp-checkin.outcome == 'success' }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, datetime

          WEBHOOK = os.environ["WEBHOOK"]
          TOKEN = os.environ["TOKEN"]
          REPO = os.environ["REPO"]
          RUN_ID = os.environ["RUN_ID"]
          FORUM_OK = os.environ["FORUM_OK"] == "true"
          YDYP_OK = os.environ["YDYP_OK"] == "true"

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          def download(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", errors="replace")

          # 拿 artifacts
          arts = fetch(f"https://api.github.com/repos/{REPO}/actions/runs/{RUN_ID}/artifacts")
          forum_text = ""
          ydyp_text = ""
          for a in arts.get("artifacts", []):
              if a["name"] == "forum-result":
                  forum_text = download(a["archive_download_url"])
              elif a["name"] == "ydyp-result":
                  ydyp_text = download(a["archive_download_url"])

          date_str = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime("%Y-%m-%d %H:%M")

          # 三站签到摘要：取原脚本输出（已经是格式化好的）
          if FORUM_OK and forum_text.strip():
              forum_summary = forum_text.strip()
          else:
              forum_summary = "签到失败，请检查日志"

          # 移动云盘摘要
          if YDYP_OK and ydyp_text.strip():
              # 提取关键结果行
              lines = [l for l in ydyp_text.splitlines()
                       if any(k in l for k in ["签到成功","已签到","获得","云朵","失效","失败"])]
              ydyp_summary = "\n".join(lines[-8:]) if lines else "签到成功"
          else:
              ydyp_summary = "签到失败，请检查日志"

          # 合并成一条消息
          msg = f"📅 每日签到 ({date_str})\n\n"
          msg += "【三站签到】\n"
          msg += forum_summary + "\n\n"
          msg += "【移动云盘】\n"
          msg += ydyp_summary

          # 推送
          if WEBHOOK:
              data = json.dumps({"msgtype": "text", "text": {"content": msg}}).encode()
              req = urllib.request.Request(WEBHOOK, data=data, method="POST",
                  headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      print("push:", json.loads(r.read()).get("errmsg"))
              except Exception as e:
                  print(f"push failed: {e}")

          print("--- 推送内容 ---")
          print(msg)
          PYEOF
