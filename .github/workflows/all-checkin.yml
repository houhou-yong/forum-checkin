name: 每日全部签到

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  # ====== 三站签到（不推送，结果通过 outputs 传出） ======
  forum-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.out.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Build runtime config
        env:
          PTTIME_COOKIE: ${{ secrets.PTTIME_COOKIE }}
          PTSKIT_COOKIE: ${{ secrets.PTSKIT_COOKIE }}
          WNFLB_USERNAME: ${{ secrets.WNFLB_USERNAME }}
          WNFLB_PASSWORD: ${{ secrets.WNFLB_PASSWORD }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python prepare_env.py
      - name: Run checkin (no push)
        run: python checkin_merged/daily_checkin_merged.py --no-push > forum_out.txt 2>&1 || true
      - name: Output
        id: out
        run: |
          echo 'result<<OUTEOF' >> "$GITHUB_OUTPUT"
          cat forum_out.txt >> "$GITHUB_OUTPUT"
          echo 'OUTEOF' >> "$GITHUB_OUTPUT"

  # ====== 移动云盘签到（不推送，结果通过 outputs 传出） ======
  ydyp-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      result: ${{ steps.out.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r ydyp-sign/requirements.txt
      - uses: actions/cache/restore@v4
        with: { path: ydyp-sign/ydyp_token_storage.json, key: ydyp-token }
      - name: Generate config (no webhook = no push)
        env:
          YDYP_ACCOUNT: ${{ secrets.YDYP_ACCOUNT }}
        run: |
          cd ydyp-sign
          python -c "import json,os;json.dump({'accounts':[os.environ['YDYP_ACCOUNT']],'push':{'wecom_webhook':''}},open('config.json','w'),ensure_ascii=False,indent=2)"
      - name: Run YDYP
        id: run
        run: |
          cd ydyp-sign
          for i in 1 2 3; do
            python run_ydyp.py > ydyp_out.txt 2>&1 && { echo "OK"; exit 0; }
            rm -f ydyp_token_storage.json
            sleep 30
          done
          echo "FAIL"
          exit 1
      - name: Output
        if: always()
        id: out
        run: |
          if [ -f ydyp-sign/ydyp_out.txt ]; then
            cp ydyp-sign/ydyp_out.txt ydyp_out.txt
          else
            echo "YDYP FAIL" > ydyp_out.txt
          fi
          echo 'result<<OUTEOF' >> "$GITHUB_OUTPUT"
          cat ydyp_out.txt >> "$GITHUB_OUTPUT"
          echo 'OUTEOF' >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: steps.run.outcome == 'success'
        with: { path: ydyp-sign/ydyp_token_storage.json, key: ydyp-token }

  # ====== 汇总推送（读 outputs，合成一条消息推） ======
  notify:
    needs: [forum-checkin, ydyp-checkin]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总推送
        env:
          WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          FORUM: ${{ needs.forum-checkin.outputs.result }}
          YDYP: ${{ needs.ydyp-checkin.outputs.result }}
        run: |
          python3 - <<'PYEOF'
          import json, os, datetime

          WEBHOOK = os.environ["WEBHOOK"]
          FORUM = os.environ["FORUM"] or "(无输出)"
          YDYP = os.environ["YDYP"] or "(无输出)"
          FORUM_OK = "全部成功" in FORUM or "签到成功" in FORUM
          YDYP_OK = "已签到" in YDYP or "签到成功" in YDYP

          date_str = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime("%Y-%m-%d %H:%M")

          # 三站签到结果
          # 过滤日志噪音
          forum_clean = "\n".join(l for l in FORUM.splitlines()
              if not any(j in l for j in ["onnxruntime","pci_bus","GetPciBusId","##[","[login]","[Cookie]","[登录]","(--no-push"])).strip()
          if "每日签到结果" in forum_clean and ("全部成功" in forum_clean or "签到成功" in forum_clean):
              forum_block = forum_clean
          else:
              forum_block = "❌ 签到失败" if "全部成功" not in forum_clean and "签到成功" not in forum_clean else forum_clean

          # 移动云盘结果：提取关键行
          ydyp_lines = [l for l in YDYP.splitlines()
                        if any(k in l for k in ["签到成功","已签到","获得","云朵","失效","失败","OK","FAIL"])]
          ydyp_block = "\n".join(ydyp_lines[-6:]) if ydyp_lines else ("签到成功" if ("已签到" in YDYP or "签到成功" in YDYP) else "签到失败")

          msg = f"📅 每日签到 ({date_str})\n\n"
          msg += "【三站签到】\n" + forum_block + "\n\n"
          msg += "【移动云盘】\n" + ydyp_block

          if not WEBHOOK:
              print("no webhook, skip")
          else:
              import urllib.request
              data = json.dumps({"msgtype":"text","text":{"content":msg}}).encode()
              req = urllib.request.Request(WEBHOOK, data=data, method="POST",
                  headers={"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      print("push:", json.loads(r.read()).get("errmsg"))
              except Exception as e:
                  print(f"push fail: {e}")

          print("--- 推送内容 ---")
          print(msg)
          PYEOF
