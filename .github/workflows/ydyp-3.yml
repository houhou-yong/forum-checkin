name: 移动云盘签到-账号3

on:
  schedule:
    # 北京时间 05:00 / 12:10 —— 与账号1 总编排 all-checkin.yml 完全一致（每天 2 次）
    - cron: "0 21 * * *"    # 北京 05:00 = UTC 21:00（账号3 仍在 GitHub 跑，每天仅此一次）
  workflow_dispatch: {}   # 允许在 Actions 页面手动点「Run workflow」即时测试

permissions:
  contents: write   # token 回写需要
  actions: write   # actions/cache 保存/删除缓存需要

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r ydyp-sign-3/requirements.txt

      - name: 恢复 Token 缓存
        id: token-restore
        uses: actions/cache/restore@v4
        with:
          path: ydyp-sign-3/ydyp_token_storage.json
          key: ydyp-token-3

      - name: 回写最新 Token 到仓库（供 NAS 侧同步）
        if: ${ '{' } steps.checkin.outcome == 'success' { '}' }
        run: |
          cd ydyp-sign-3
          if [ -f ydyp_token_storage.json ]; then
            git config user.name "fmdxx1991"
            git config user.email "fmdxx1991@gmail.com"
            git add ydyp_token_storage.json
            if git diff --cached --quiet; then
              echo "token 无变化，跳过提交"
            else
              git commit -m "chore: 同步最新 ydyp token (auto)"
              git pull --rebase origin ${ '{' } github.ref_name { '}' } || true
              git push origin HEAD:${ '{' } github.ref_name { '}' }
              echo "✅ 最新 token 已提交到仓库"
            fi
          fi

      - name: 生成配置文件
        env:
          YDYP_ACCOUNT_3: ${{ secrets.YDYP_ACCOUNT_3 }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          cd ydyp-sign-3
          python - <<'EOF'
          import json, os
          cfg = {
              "accounts": [os.environ["YDYP_ACCOUNT_3"]],
              "push": {"wecom_webhook": os.environ["WECOM_WEBHOOK"]},
          }
          json.dump(cfg, open("config.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          EOF

      - name: 执行签到（最多 3 次尝试）
        id: checkin
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          YDYP_NOTIFY_PREFIX: "【GitHub】"
        run: |
          cd ydyp-sign-3
          for i in 1 2 3; do
            echo "===== 第 ${i}/3 次尝试 ====="
            python run_ydyp.py && {
              echo "✅ 签到成功"
              exit 0
            }
            echo "❌ 第 ${i} 次失败，清理 token 缓存后重试..."
            rm -f ydyp_token_storage.json
            sleep 30
          done
          echo "::error::移动云盘账号3签到连续 3 次失败"
          python - <<'EOF'
          import json, os, requests
          webhook = os.environ["WECOM_WEBHOOK"]
          try:
              resp = requests.post(webhook, json={"msgtype": "text", "text": {"content": "【GitHub】❌ 移动云盘账号3签到连续 3 次失败，请检查（可能 Authorization 失效，需重新登录 yun.139.com 抓取并更新 GitHub Secret YDYP_ACCOUNT_3）"}}, timeout=15)
              print("失败通知已发送:", resp.json().get("errmsg"))
          except Exception as exc:
              print("失败通知发送异常:", exc)
          EOF
          exit 1

      - name: 保存 Token 缓存
        if: ${{ steps.checkin.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ydyp-sign-3/ydyp_token_storage.json
          key: ydyp-token-3
