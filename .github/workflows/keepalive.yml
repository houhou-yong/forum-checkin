name: 保活（空提交防定时任务被停用）

# GitHub 对「长期无新提交」的仓库会自动停用 scheduled workflow。
# 本工作流每月空提交一次，制造仓库活动，从而保住每日 07:00 的签到定时不被停用。
on:
  workflow_dispatch: {}   # 已不需要保活（无 GitHub 内部定时，全靠 EasyCron）

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # 让后续 git push 使用 GITHUB_TOKEN

      - name: 空提交保活
        run: |
          git config user.name "forum-checkin-bot"
          git config user.email "checkin@local"
          git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git push
