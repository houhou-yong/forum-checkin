name: Watchdog 签到巡检

on:
  workflow_dispatch: {}

permissions:
  actions: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 巡检 + 补发 + 推送
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta

          TZ = timezone(timedelta(hours=8))
          TODAY = datetime.now(TZ).strftime("%Y-%m-%d")
          TOKEN = os.environ["TOKEN"]
          WEBHOOK = os.environ["WEBHOOK"]
          REPO = os.environ["REPO"]

          def api_get(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/{path}",
                  headers={"Authorization": f"Bearer {TOKEN}",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read())

          def trigger(wf):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/actions/workflows/{wf}/dispatches",
                  method="POST", data=json.dumps({"ref":"main"}).encode(),
                  headers={"Authorization": f"Bearer {TOKEN}",
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=20)
                  return True
              except:
                  return False

          def notify(text):
              data = json.dumps({"msgtype":"text","text":{"content":text}}).encode()
              req = urllib.request.Request(WEBHOOK, data=data, method="POST",
                  headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req, timeout=10) as r:
                  print("push:", json.loads(r.read()).get("errmsg"))

          runs = api_get("actions/runs?per_page=50")["workflow_runs"]
          today_runs = [r for r in runs if r["created_at"][:10] == TODAY]

          targets = [("daily-checkin.yml", "三站签到"), ("ydyp.yml", "移动云盘")]
          lines, has_issue = [], False

          for wf, name in targets:
              ok = [r for r in today_runs if wf in r.get("path","")
                    and r.get("conclusion") == "success"]
              failed = [r for r in today_runs if wf in r.get("path","")
                        and r.get("conclusion") == "failure"]
              if ok:
                  lines.append(f"  ✅ {name}: 成功{len(ok)}次")
              else:
                  has_issue = True
                  detail = f"失败{len(failed)}次" if failed else "未触发"
                  lines.append(f"  ❌ {name}: {detail}")
                  if trigger(wf):
                      lines.append(f"     → 已补触发")

          now = datetime.now(TZ).strftime("%H:%M")
          status = "🔔 巡检异常" if has_issue else "✅ 签到正常"
          msg = f"{status} ({TODAY} {now})\n" + "\n".join(lines)
          if has_issue:
              msg += "\n\n已自动补发，如仍无通知请手动检查"
          notify(msg)
          PYEOF
